spring.application.name=vjeditor-api
spring.datasource.url=jdbc:h2:file:./data/vjeditor;AUTO_SERVER=TRUE;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.h2.console.enabled=true
server.port=8080
vjeditor.frontend-origins=${VJEDITOR_FRONTEND_ORIGINS:http://localhost:5173,http://localhost:5174}
vjeditor.auth.username=${VJEDITOR_AUTH_USERNAME:admin}
vjeditor.auth.password=${VJEDITOR_AUTH_PASSWORD:VJEditorFree2026!}
vjeditor.auth.jwt-secret=${VJEDITOR_JWT_SECRET:dev-only-secret-change-this-value-1234567890}
vjeditor.auth.expiration-seconds=3600