spring.datasource.url=jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:vjeditor}
spring.datasource.username=${DATABASE_USERNAME:vjeditor}
spring.datasource.password=${DATABASE_PASSWORD:vjeditor}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always
vjeditor.frontend-origins=${VJEDITOR_FRONTEND_ORIGINS:http://localhost:5173,http://localhost:5174}