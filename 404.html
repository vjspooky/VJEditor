}

/* Custom Scrollbars */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: #0f1117;
}
::-webkit-scrollbar-thumb {
  background: #232838;
  border-radius: 3px;
}
::-webkit-scrollbar-thumb:hover {
  background: #333a52;
}

/* Custom Range Sliders */
input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  background: #1e2230;
  height: 4px;
  border-radius: 2px;
  outline: none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #06b6d4;
  cursor: pointer;
  box-shadow: 0 0 8px rgba(6, 182, 212, 0.5);
  transition: transform 0.1s ease;
}
input[type="range"]::-webkit-slider-thumb:hover {
  transform: scale(1.2);
}

/* Custom Number & Text Inputs */
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

/* Timeline grid & ruler */
.timeline-grid {
  background-size: 20px 20px;
  background-image: 
    linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
}

/* Keyframe diamond */
.keyframe-diamond {
  width: 10px;
  height: 10px;
  transform: rotate(45deg);
  background: #06b6d4;
  box-shadow: 0 0 6px rgba(6, 182, 212, 0.8);
  cursor: pointer;
}
.keyframe-diamond.active {
  background: #f59e0b;
  box-shadow: 0 0 8px rgba(245, 158, 11, 0.9);
}

/* Audio Level Meter */
.meter-led {
  height: 4px;
  border-radius: 1px;
  background: #1a1e2b;
}
.meter-led.active-green { background: #10b981; box-shadow: 0 0 4px #10b981; }
.meter-led.active-yellow { background: #f59e0b; box-shadow: 0 0 4px #f59e0b; }
.meter-led.active-red { background: #ef4444; box-shadow: 0 0 4px #ef4444; }

/* Safe zone indicators */
.safe-zone-action {
  border: 1px dashed rgba(6, 182, 212, 0.4);
}
.safe-zone-title {
  border: 1px dashed rgba(244, 63, 94, 0.4);
}

/* Timecode font */
.font-mono-time {
  font-family: 'JetBrains Mono', monospace;
  font-feature-settings: 'tnum';
}

/* Animations */
@keyframes pulse-subtle {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}
.animate-recording {
  animation: pulse-subtle 1.2s infinite;
}

/* Backdrop blur support */
.glass-panel {
  background: rgba(18, 20, 26, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

// Web Audio API Synthesis & Visualizer Engine
class VJAudioEngine {
  constructor() {
    this.ctx = null;
    this.masterGain = null;
    this.analyser = null;
    this.activeNodes = [];
    this.isPlaying = false;
    this.currentBgm = null;
    this.dataArray = null;
  }

  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) {
        this.ctx = new AudioCtx();
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.setValueAtTime(0.8, this.ctx.currentTime);
        this.analyser = this.ctx.createAnalyser();
        this.analyser.fftSize = 64;
        this.masterGain.connect(this.analyser);
        this.analyser.connect(this.ctx.destination);
        this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
      }
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  setMasterVolume(val) {
    if (this.masterGain && this.ctx) {
      this.masterGain.gain.setValueAtTime(Math.max(0, Math.min(1, val)), this.ctx.currentTime);
    }
  }

  // Real-time SFX Synthesis
  playSFX(type = 'whoosh', volume = 0.8) {
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const sfxGain = this.ctx.createGain();
    sfxGain.gain.setValueAtTime(volume, now);
    sfxGain.connect(this.masterGain);

    if (type === 'whoosh') {
      // Filtered White Noise Sweep
      const bufferSize = this.ctx.sampleRate * 0.8;
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }
      const noise = this.ctx.createBufferSource();
      noise.buffer = buffer;
      const filter = this.ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.Q.value = 3.0;
      filter.frequency.setValueAtTime(200, now);
      filter.frequency.exponentialRampToValueAtTime(3200, now + 0.35);
      filter.frequency.exponentialRampToValueAtTime(150, now + 0.75);

      sfxGain.gain.setValueAtTime(0.01, now);
      sfxGain.gain.linearRampToValueAtTime(volume, now + 0.3);
      sfxGain.gain.exponentialRampToValueAtTime(0.001, now + 0.75);

      noise.connect(filter);
      filter.connect(sfxGain);
      noise.start(now);
      noise.stop(now + 0.8);
    } else if (type === 'hit' || type === 'impact') {
      // Sub Bass Pitch Drop + Distorted Punch
      const osc = this.ctx.createOscillator();
      const oscGain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(180, now);
      osc.frequency.exponentialRampToValueAtTime(35, now + 0.6);

      oscGain.gain.setValueAtTime(volume * 1.2, now);
      oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);

      // Noise click
      const click = this.ctx.createOscillator();
      click.type = 'sine';
      click.frequency.setValueAtTime(800, now);
      click.frequency.exponentialRampToValueAtTime(40, now + 0.08);
      const clickGain = this.ctx.createGain();
      clickGain.gain.setValueAtTime(volume, now);
      clickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

      click.connect(clickGain);
      clickGain.connect(sfxGain);
      click.start(now);
      click.stop(now + 0.09);

      osc.connect(oscGain);
      oscGain.connect(sfxGain);
      osc.start(now);
      osc.stop(now + 0.9);
    } else if (type === 'pop') {
      // Clean high bubble blip
      const osc = this.ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(380, now);
      osc.frequency.exponentialRampToValueAtTime(1150, now + 0.12);
      sfxGain.gain.setValueAtTime(volume, now);
      sfxGain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      osc.connect(sfxGain);
      osc.start(now);
      osc.stop(now + 0.16);
    } else if (type === 'click' || type === 'ui') {
      // Short UI Click
      const osc = this.ctx.createOscillator();
      osc.type = 'square';
      osc.frequency.setValueAtTime(1200, now);
      sfxGain.gain.setValueAtTime(volume * 0.4, now);
      sfxGain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
      osc.connect(sfxGain);
      osc.start(now);
      osc.stop(now + 0.05);
    } else if (type === 'bell' || type === 'notification') {
      // Chime bell chord
      [880, 1320, 1760].forEach((freq, idx) => {
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + idx * 0.06);
        g.gain.setValueAtTime(volume * 0.35, now + idx * 0.06);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.8 + idx * 0.06);
        osc.connect(g);
        g.connect(sfxGain);
        osc.start(now + idx * 0.06);
        osc.stop(now + 0.9 + idx * 0.06);
      });
    } else if (type === 'explosion') {
      // Low rumble explosion
      const bufferSize = this.ctx.sampleRate * 1.5;
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
      const noise = this.ctx.createBufferSource();
      noise.buffer = buffer;
      const lp = this.ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.setValueAtTime(450, now);
      lp.frequency.exponentialRampToValueAtTime(60, now + 1.2);
      sfxGain.gain.setValueAtTime(volume * 1.2, now);
      sfxGain.gain.exponentialRampToValueAtTime(0.001, now + 1.4);
      noise.connect(lp);
      lp.connect(sfxGain);
      noise.start(now);
      noise.stop(now + 1.5);
    }
  }

  // Procedural Music Synthesis Loop
  startMusicLoop(genre = 'cinematic', volume = 0.5) {
    this.init();
    if (!this.ctx) return;
    this.stopMusic();

    const now = this.ctx.currentTime;
    const bgmGain = this.ctx.createGain();
    bgmGain.gain.setValueAtTime(0.01, now);
    bgmGain.gain.linearRampToValueAtTime(volume * 0.6, now + 1.0);
    bgmGain.connect(this.masterGain);

    const chords = genre === 'lo-fi' 
      ? [ [261.63, 329.63, 392.00, 493.88], [220.00, 261.63, 329.63, 392.00] ] // Cmaj7, Am7
      : genre === 'cyberpunk'
      ? [ [110.00, 164.81, 220.00], [98.00, 146.83, 196.00] ] // A minor, G power
      : [ [130.81, 196.00, 261.63, 329.63], [146.83, 220.00, 293.66, 369.99] ]; // C, D chord

    const oscs = [];
    chords[0].forEach((freq) => {
      const osc = this.ctx.createOscillator();
      const oscG = this.ctx.createGain();
      osc.type = genre === 'lo-fi' ? 'triangle' : 'sine';
      osc.frequency.setValueAtTime(freq, now);
      oscG.gain.setValueAtTime(0.18, now);
      osc.connect(oscG);
      oscG.connect(bgmGain);
      osc.start(now);
      oscs.push(osc);
    });

    // LFO modulation for warm analog drift
    const lfo = this.ctx.createOscillator();
    lfo.frequency.setValueAtTime(0.4, now);
    const lfoGain = this.ctx.createGain();
    lfoGain.gain.setValueAtTime(3.5, now);
    lfo.connect(lfoGain);
    oscs.forEach(o => lfoGain.connect(o.frequency));
    lfo.start(now);

    this.currentBgm = { oscs, lfo, gain: bgmGain };
  }

  stopMusic() {
    if (this.currentBgm && this.ctx) {
      try {
        const now = this.ctx.currentTime;
        this.currentBgm.gain.gain.linearRampToValueAtTime(0.001, now + 0.3);
        setTimeout(() => {
          if (this.currentBgm) {
            this.currentBgm.oscs.forEach(o => { try { o.stop(); } catch(e){} });
            try { this.currentBgm.lfo.stop(); } catch(e){}
            this.currentBgm = null;
          }
        }, 350);
      } catch(e) {
        this.currentBgm = null;
      }
    }
  }

  getAudioLevels() {
    if (!this.analyser || !this.dataArray) {
      return { left: 0, right: 0, peak: -60 };
    }
    this.analyser.getByteFrequencyData(this.dataArray);
    let sum = 0;
    for (let i = 0; i < this.dataArray.length; i++) {
      sum += this.dataArray[i];
    }
    const avg = sum / (this.dataArray.length * 255);
    const left = Math.min(1, avg * 1.5);
    const right = Math.min(1, avg * 1.42 + (Math.random() * 0.05));
    const peakDb = avg > 0.01 ? Math.round(20 * Math.log10(avg)) : -60;
    return { left, right, peak: peakDb };
  }
}

const audioEngine = new VJAudioEngine();



// Canvas Compositor & Image Cache System
const imageCache = new Map();

function preloadImage(url) {
  if (!url || imageCache.has(url)) return imageCache.get(url);
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.src = url;
  imageCache.set(url, img);
  return img;
}

// Pre-seed image cache
DEFAULT_MEDIA.forEach(m => preloadImage(m.url));

// Color distance helper for Chroma Keying
function hexToRgb(hex) {
  const clean = hex.replace('#', '');
  const bigint = parseInt(clean, 16);
  return {
    r: (bigint >> 16) & 255,
    g: (bigint >> 8) & 255,
    b: bigint & 255
  };
}

// Keyframe Interpolation
function interpolateKeyframes(clip, currentTime, property, defaultValue) {
  if (!clip.keyframes || clip.keyframes.length === 0) return defaultValue;
  const propKfs = clip.keyframes
    .filter(k => k.property === property)
    .sort((a, b) => a.time - b.time);

  if (propKfs.length === 0) return defaultValue;
  const localTime = currentTime - clip.startTime;

  if (localTime <= propKfs[0].time) return propKfs[0].value;
  if (localTime >= propKfs[propKfs.length - 1].time) return propKfs[propKfs.length - 1].value;

  for (let i = 0; i < propKfs.length - 1; i++) {
    const k1 = propKfs[i];
    const k2 = propKfs[i + 1];
    if (localTime >= k1.time && localTime <= k2.time) {
      const t = (localTime - k1.time) / (k2.time - k1.time);
      // Linear or Ease
      const easedT = k1.easing === 'ease-out' 
        ? Math.sin((t * Math.PI) / 2) 
        : k1.easing === 'ease-in'
        ? 1 - Math.cos((t * Math.PI) / 2)
        : t;
      return k1.value + (k2.value - k1.value) * easedT;
    }
  }
  return defaultValue;
}

// Main Frame Renderer
function renderVideoFrame({
  canvas,
  project,
  currentTime,
  selectedClipId,
  showSafeZones = false,
  aspectRatio = '16:9'
}) {
  if (!canvas || !project) return;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  if (!ctx) return;

  const width = canvas.width;
  const height = canvas.height;

  // 1. Clear background
  ctx.fillStyle = '#090a0f';
  ctx.fillRect(0, 0, width, height);

  // 2. Sort tracks from bottom to top: Video 1 -> Video 2 -> Stickers -> Text -> Captions
  const trackOrder = ['video', 'audio', 'sticker', 'text', 'caption'];
  const sortedTracks = [...project.tracks].sort((a, b) => {
    return trackOrder.indexOf(a.type) - trackOrder.indexOf(b.type);
  });

  // Track active video layers for offscreen Chroma keying
  let offCanvas = null;
  let offCtx = null;

  sortedTracks.forEach(track => {
    if (!track.isVisible) return;

    track.clips.forEach(clip => {
      // Check if clip is active at currentTime
      if (currentTime < clip.startTime || currentTime >= clip.startTime + clip.duration) {
        return;
      }

      const localTime = currentTime - clip.startTime;
      ctx.save();

      // Position, Scale, Rotation, Opacity
      const posX = interpolateKeyframes(clip, currentTime, 'x', clip.x || 0);
      const posY = interpolateKeyframes(clip, currentTime, 'y', clip.y || 0);
      const scale = interpolateKeyframes(clip, currentTime, 'scale', clip.scale || 1.0);
      const rot = interpolateKeyframes(clip, currentTime, 'rotation', clip.rotation || 0);
      const opacity = interpolateKeyframes(clip, currentTime, 'opacity', clip.opacity !== undefined ? clip.opacity : 1.0);

      ctx.globalAlpha = Math.max(0, Math.min(1, opacity));

      // Video / Image Clips
      if (clip.type === 'video' || clip.type === 'image') {
        const img = preloadImage(clip.mediaUrl);
        if (img && img.complete && img.naturalWidth > 0) {
          const cx = width / 2 + posX;
          const cy = height / 2 + posY;
          const drawW = width * scale;
          const drawH = height * scale;

          ctx.translate(cx, cy);
          ctx.rotate((rot * Math.PI) / 180);
          if (clip.flipH || clip.flipV) {
            ctx.scale(clip.flipH ? -1 : 1, clip.flipV ? -1 : 1);
          }

          // Chroma Key Green Screen processing
          if (clip.chromaKey && clip.chromaKey.enabled) {
            if (!offCanvas) {
              offCanvas = document.createElement('canvas');
              offCanvas.width = 640;
              offCanvas.height = 360;
              offCtx = offCanvas.getContext('2d', { willReadFrequently: true });
            }
            offCtx.clearRect(0, 0, 640, 360);
            offCtx.drawImage(img, 0, 0, 640, 360);
            const imgData = offCtx.getImageData(0, 0, 640, 360);
            const data = imgData.data;
            const target = hexToRgb(clip.chromaKey.keyColor || '#2b9849');
            const sim = (clip.chromaKey.similarity || 0.35) * 255;
            const smooth = (clip.chromaKey.smoothness || 0.15) * 255;

            for (let i = 0; i < data.length; i += 4) {
              const r = data[i];
              const g = data[i + 1];
              const b = data[i + 2];
              // Color Euclidean distance
              const dist = Math.sqrt(
                Math.pow(r - target.r, 2) +
                Math.pow(g - target.g, 2) * 1.5 +
                Math.pow(b - target.b, 2)
              );

              if (dist < sim) {
                data[i + 3] = 0; // Transparent
              } else if (dist < sim + smooth) {
                data[i + 3] = Math.round(((dist - sim) / smooth) * 255);
              }
              // Green spill suppression
              if (g > (r + b) / 2) {
                data[i + 1] = Math.round((r + b) / 2);
              }
            }
            offCtx.putImageData(imgData, 0, 0);

            // Color grading filters
            const cg = clip.colorGrading || {};
            const filterStr = `brightness(${cg.brightness || 1}) contrast(${cg.contrast || 1}) saturate(${cg.saturation || 1})`;
            ctx.filter = filterStr;
            ctx.drawImage(offCanvas, -drawW / 2, -drawH / 2, drawW, drawH);
            ctx.filter = 'none';
          } else {
            // Standard render with color grading
            const cg = clip.colorGrading || {};
            const filterParts = [];
            if (cg.brightness) filterParts.push(`brightness(${cg.brightness})`);
            if (cg.contrast) filterParts.push(`contrast(${cg.contrast})`);
            if (cg.saturation) filterParts.push(`saturate(${cg.saturation})`);
            if (cg.temperature && cg.temperature !== 0) {
              filterParts.push(`hue-rotate(${cg.temperature * 40}deg)`);
            }
            ctx.filter = filterParts.length > 0 ? filterParts.join(' ') : 'none';
            ctx.drawImage(img, -drawW / 2, -drawH / 2, drawW, drawH);
            ctx.filter = 'none';
          }

          // Special effects stack
          if (clip.effects && clip.effects.length > 0) {
            clip.effects.forEach(eff => {
              if (eff.type === 'vignette') {
                const grad = ctx.createRadialGradient(0, 0, drawW * 0.25, 0, 0, drawW * 0.7);
                grad.addColorStop(0, 'rgba(0,0,0,0)');
                grad.addColorStop(1, `rgba(0,0,0,${(eff.intensity || 50) / 100})`);
                ctx.fillStyle = grad;
                ctx.fillRect(-drawW / 2, -drawH / 2, drawW, drawH);
              } else if (eff.type === 'letterbox') {
                const barHeight = height * 0.12;
                ctx.fillStyle = '#000000';
                ctx.fillRect(-drawW / 2, -drawH / 2, drawW, barHeight);
                ctx.fillRect(-drawW / 2, drawH / 2 - barHeight, drawW, barHeight);
              } else if (eff.type === 'rgb-split') {
                // Subtle RGB edge glow
                ctx.strokeStyle = 'rgba(6, 182, 212, 0.35)';
                ctx.lineWidth = 3;
                ctx.strokeRect(-drawW / 2 + 3, -drawH / 2, drawW, drawH);
              }
            });
          }
        }
      }

      // Text Clips
      else if (clip.type === 'text') {
        const cx = width / 2 + posX;
        const cy = height / 2 + posY;
        ctx.translate(cx, cy);
        ctx.rotate((rot * Math.PI) / 180);
        ctx.scale(scale, scale);

        let displayText = clip.content || 'Text Title';
        if (clip.animation === 'typewriter') {
          const progress = Math.min(1, localTime / 1.5);
          const chars = Math.floor(displayText.length * progress);
          displayText = displayText.substring(0, chars);
        }

        ctx.font = `${clip.fontWeight || '700'} ${clip.fontSize || 42}px '${clip.font || 'Inter'}', sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        // Background box
        if (clip.bg) {
          const metrics = ctx.measureText(displayText);
          const textW = metrics.width + 36;
          const textH = (clip.fontSize || 42) * 1.5;
          ctx.fillStyle = clip.bg;
          ctx.fillRect(-textW / 2, -textH / 2, textW, textH);
        }

        // Drop shadow
        if (clip.shadow) {
          ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
          ctx.shadowBlur = 12;
          ctx.shadowOffsetX = 3;
          ctx.shadowOffsetY = 3;
        }

        // Stroke
        if (clip.stroke && clip.strokeWidth) {
          ctx.strokeStyle = clip.stroke;
          ctx.lineWidth = clip.strokeWidth;
          ctx.strokeText(displayText, 0, 0);
        }

        ctx.fillStyle = clip.color || '#ffffff';
        ctx.fillText(displayText, 0, 0);
        ctx.shadowColor = 'transparent';
      }

      // Captions & Subtitles
      else if (clip.type === 'caption') {
        const cx = width / 2;
        const cy = height - 120; // Lower subtitle position
        ctx.translate(cx, cy);

        const text = clip.content || '';
        const fontSize = clip.fontSize || 32;
        ctx.font = `600 ${fontSize}px 'Inter', sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        // Karaoke or Bold Social styling
        if (clip.style === 'karaoke' || clip.style === 'bold') {
          const metrics = ctx.measureText(text);
          const boxW = metrics.width + 48;
          const boxH = fontSize * 1.6;

          // Translucent dark rounded pill
          ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
          ctx.beginPath();
          ctx.roundRect(-boxW / 2, -boxH / 2, boxW, boxH, 12);
          ctx.fill();

          ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
          ctx.lineWidth = 1;
          ctx.stroke();

          // Render words with highlight
          if (clip.highlightWord && text.includes(clip.highlightWord)) {
            const parts = text.split(clip.highlightWord);
            ctx.fillStyle = '#ffffff';
            ctx.fillText(text, 0, 0);

            // Overlay highlight word in energetic cyan/yellow
            ctx.fillStyle = '#facc15';
            ctx.fillText(clip.highlightWord, 0, 0);
          } else {
            ctx.fillStyle = clip.color || '#ffffff';
            ctx.fillText(text, 0, 0);
          }
        } else {
          // Minimal Subtitle
          ctx.shadowColor = 'rgba(0,0,0,0.9)';
          ctx.shadowBlur = 8;
          ctx.fillStyle = '#ffffff';
          ctx.fillText(text, 0, 0);
          ctx.shadowColor = 'transparent';
        }
      }

      // Selection Bounding Box on Canvas
      if (clip.id === selectedClipId) {
        ctx.strokeStyle = '#06b6d4';
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 4]);
        const boxW = (width * scale) * 0.45;
        const boxH = (height * scale) * 0.45;
        ctx.strokeRect(-boxW / 2, -boxH / 2, boxW, boxH);
        ctx.setLineDash([]);

        // Handle points
        ctx.fillStyle = '#ffffff';
        [
          [-boxW / 2, -boxH / 2], [boxW / 2, -boxH / 2],
          [-boxW / 2, boxH / 2], [boxW / 2, boxH / 2]
        ].forEach(([hx, hy]) => {
          ctx.fillRect(hx - 4, hy - 4, 8, 8);
        });
      }

      ctx.restore();
    });
  });

  // 3. Watermark from Brand Kit
  if (project.brandKit && project.brandKit.watermarkEnabled) {
    ctx.save();
    ctx.globalAlpha = project.brandKit.watermarkOpacity || 0.7;
    ctx.font = '700 18px Montserrat, sans-serif';
    ctx.fillStyle = project.brandKit.primaryColor || '#06b6d4';
    const logoText = project.brandKit.logoName || 'VJEDITOR';

    if (project.brandKit.watermarkPosition === 'top-right') {
      ctx.textAlign = 'right';
      ctx.fillText(logoText, width - 36, 44);
    } else if (project.brandKit.watermarkPosition === 'bottom-right') {
      ctx.textAlign = 'right';
      ctx.fillText(logoText, width - 36, height - 36);
    } else {
      ctx.textAlign = 'left';
      ctx.fillText(logoText, 36, 44);
    }
    ctx.restore();
  }

  // 4. Safe Zones Overlay
  if (showSafeZones) {
    ctx.save();
    // Action Safe (90%)
    ctx.strokeStyle = 'rgba(6, 182, 212, 0.45)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([8, 6]);
    ctx.strokeRect(width * 0.05, height * 0.05, width * 0.9, height * 0.9);

    // Title Safe (80%)
    ctx.strokeStyle = 'rgba(244, 63, 94, 0.45)';
    ctx.strokeRect(width * 0.1, height * 0.1, width * 0.8, height * 0.8);
    ctx.setLineDash([]);

    // TikTok/Shorts UI bounds when in 9:16
    if (aspectRatio === '9:16') {
      ctx.fillStyle = 'rgba(244, 63, 94, 0.12)';
      // Bottom caption & sound zone
      ctx.fillRect(0, height - 260, width, 260);
      // Right side likes & share icon zone
      ctx.fillRect(width - 90, height / 2 - 120, 90, 280);
      ctx.font = '14px Inter, sans-serif';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.textAlign = 'center';
      ctx.fillText('TikTok / Reels UI Safe Margin', width / 2, height - 30);
    }
    ctx.restore();
  }
}



// Top Toolbar Component
function TopToolbar({

function Sidebar({
  activeTab,
  setActiveTab,
  project,
  setProject,
  onAddMediaClip,
  onAddTextClip,
  onAddStickerClip,
  onAddAudioClip,
  onAddCaptionClip,
  onApplyTemplate,
  onOpenRecord,
  onOpenAIVideoModal,
  selectedClip
}) {
  const [mediaList, setMediaList] = React.useState(DEFAULT_MEDIA);
  const [audioCategory, setAudioCategory] = React.useState('All');
  const [audioPlayingId, setAudioPlayingId] = React.useState(null);
  const fileInputRef = React.useRef(null);

  // File Upload Handler (video, audio, image)
  const handleFileUpload = (e) => {
    const files = e.target.files;
    if (!files || files.length === 0) return;
    Array.from(files).forEach((file) => {
      const url = URL.createObjectURL(file);
      const isVideo = file.type.startsWith('video');
      const isAudio = file.type.startsWith('audio');
      const newMedia = {
        id: 'media-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4),
        name: file.name,
        type: isVideo ? 'video' : isAudio ? 'audio' : 'image',
        url: url,
        thumbnail: url,
        duration: isVideo ? 10.0 : isAudio ? 15.0 : 5.0,
        width: 1920,
        height: 1080,
        fps: 30,
        size: (file.size / (1024 * 1024)).toFixed(1) + ' MB',
        tag: 'User Upload'
      };
      setMediaList(prev => [newMedia, ...prev]);
    });
  };

  // Sound Preview Player
  const toggleAudioPreview = (item, isMusic = true) => {
    if (audioPlayingId === item.id) {
      audioEngine.stopMusic();
      setAudioPlayingId(null);
    } else {
      audioEngine.stopMusic();
      setAudioPlayingId(item.id);
      if (isMusic) {
        audioEngine.startMusicLoop(item.category.toLowerCase(), 0.6);
      } else {
        audioEngine.playSFX(item.id.replace('sfx-', ''), 0.8);
      }
    }
  };

  return (
    <div className="flex h-full bg-[#12141a] border-r border-[#202433] select-none z-20">
      {/* Tab Nav Column */}
      <div className="w-18 bg-[#0e1015] border-r border-[#1c1f2b] flex flex-col items-center py-3 space-y-1 overflow-y-auto">
        {SIDEBAR_TABS.map((tab) => {
          const isActive = activeTab === tab.id;
          return (
            <button
              key={tab.id}
              onClick={() => setActiveTab(tab.id)}
              className={`w-14 h-13 rounded-xl flex flex-col items-center justify-center transition group relative ${
                isActive ? 'bg-[#1e2332] text-white shadow-sm' : 'text-slate-400 hover:text-slate-200 hover:bg-[#151821]'
              }`}
              title={tab.label}
            >
              {isActive && (
                <div className="absolute left-0 top-2 bottom-2 w-1 bg-cyan-400 rounded-r-full"></div>
              )}
              <SidebarTabIcon id={tab.id} active={isActive} />
              <span className={`text-[10px] font-medium mt-1 tracking-tight ${isActive ? 'text-cyan-400 font-semibold' : 'text-slate-400'}`}>
                {tab.label}
              </span>
            </button>
          );
        })}
      </div>

      {/* Tab Content Panel */}
      <div className="w-80 bg-[#12141a] flex flex-col h-full border-r border-[#202433] overflow-hidden">
        {/* MEDIA TAB */}
        {activeTab === 'media' && (
          <div className="flex flex-col h-full p-4 space-y-4 overflow-y-auto">
            <div className="flex items-center justify-between">
              <h2 className="text-sm font-bold text-white tracking-wide uppercase">Media Assets</h2>
              <span className="text-xs text-slate-400 font-medium">{mediaList.length} items</span>
            </div>

            {/* Upload & Record Buttons */}
            <div className="grid grid-cols-2 gap-2">
              <button
                onClick={() => fileInputRef.current && fileInputRef.current.click()}
                className="flex items-center justify-center space-x-1.5 bg-[#1b1f2d] hover:bg-[#24293c] text-white font-medium text-xs py-2.5 px-3 rounded-lg border border-[#2b3147] transition shadow-sm"
              >
                <svg className="w-4 h-4 text-cyan-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                  <polyline points="17 8 12 3 7 8"></polyline>
                  <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                <span>Import Files</span>
              </button>
              <input
                ref={fileInputRef}
                type="file"
                multiple
                accept="video/*,audio/*,image/*"
                onChange={handleFileUpload}

                  onChange={(e) => setProject(prev => ({
                    ...prev,
                    brandKit: { ...prev.brandKit, watermarkEnabled: e.target.checked }
                  }))}
                  className="w-4 h-4 accent-cyan-500 rounded"
                />
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}



// Center Video Preview & Playback Controls
function formatTimecode(seconds, fps = 30) {
  const s = Math.max(0, seconds);
  const hrs = Math.floor(s / 3600);
  const mins = Math.floor((s % 3600) / 60);
  const secs = Math.floor(s % 60);
  const frames = Math.floor((s % 1) * fps);

  const pad = (n) => String(n).padStart(2, '0');
  return `${pad(hrs)}:${pad(mins)}:${pad(secs)}:${pad(frames)}`;
}

function CanvasPreview({
  canvasRef,
  project,
  setProject,
  currentTime,
  setCurrentTime,
  isPlaying,
  setIsPlaying,
  playbackSpeed,
  setPlaybackSpeed,
  aspectRatio,
  setAspectRatio,
  zoomLevel,
  setZoomLevel,
  showSafeZones,
  setShowSafeZones,
  isLooping,
  setIsLooping,
  volume,
  setVolume,
  isMuted,
  setIsMuted
}) {
  const [audioMeter, setAudioMeter] = React.useState({ left: 0, right: 0, peak: -60 });
  const [visualizerMode, setVisualizerMode] = React.useState('bars');

  // Audio meter polling
  React.useEffect(() => {
    let animId;
    const poll = () => {
      if (isPlaying) {
        setAudioMeter(audioEngine.getAudioLevels());
      } else {
        setAudioMeter({ left: 0, right: 0, peak: -60 });
      }
      animId = requestAnimationFrame(poll);
    };
    animId = requestAnimationFrame(poll);
    return () => cancelAnimationFrame(animId);
  }, [isPlaying]);

  // Frame Stepping
  const stepFrame = (deltaFrames) => {
    const fps = project.fps || 30;
    const newTime = Math.max(0, Math.min(project.duration, currentTime + deltaFrames / fps));
    setCurrentTime(newTime);
  };

  // Determine Aspect Ratio Container CSS
  const getAspectClass = () => {
    switch (aspectRatio) {
      case '9:16': return 'w-[320px] h-[568px]';
      case '1:1': return 'w-[480px] h-[480px]';
      case '4:5': return 'w-[420px] h-[525px]';
      case '4:3': return 'w-[560px] h-[420px]';
      case '21:9': return 'w-[700px] h-[300px]';
      case '16:9':
      default: return 'w-[640px] h-[360px] max-w-full';
    }
  };

  const getCanvasResolution = () => {
    switch (aspectRatio) {
      case '9:16': return { w: 1080, h: 1920 };
      case '1:1': return { w: 1080, h: 1080 };
      case '4:5': return { w: 1080, h: 1350 };
      case '4:3': return { w: 1440, h: 1080 };
      case '21:9': return { w: 2560, h: 1080 };
      case '16:9':
      default: return { w: 1920, h: 1080 };
    }
  };

  const res = getCanvasResolution();

  return (
    <div className="flex-1 flex flex-col bg-[#0b0c10] overflow-hidden select-none relative">
      {/* Viewport Top Bar (Aspect Ratio, Zoom, Safe Zones) */}
      <div className="h-10 bg-[#12141a] border-b border-[#202433] px-4 flex items-center justify-between z-10">
        <div className="flex items-center space-x-3">
          {/* Aspect Ratio Selector */}
          <div className="flex items-center space-x-1.5 text-xs">
            <span className="text-slate-400 font-medium">Aspect:</span>
            <select
              value={aspectRatio}
              onChange={(e) => setAspectRatio(e.target.value)}
              className="bg-[#1b1f2d] text-cyan-400 font-semibold px-2 py-1 rounded border border-[#2b3147] text-xs outline-none cursor-pointer"
            >
              <option value="16:9">16:9 (Landscape YouTube)</option>
              <option value="9:16">9:16 (Shorts / Reels / TikTok)</option>
              <option value="1:1">1:1 (Square Feed)</option>
              <option value="4:5">4:5 (Instagram Portrait)</option>
              <option value="4:3">4:3 (Classic Television)</option>
              <option value="21:9">21:9 (Cinematic Ultrawide)</option>
            </select>
          </div>

          <div className="h-4 w-px bg-[#262b3d]"></div>

          {/* Zoom Level */}
          <div className="flex items-center space-x-1.5 text-xs">
            <span className="text-slate-400 font-medium">Zoom:</span>
            <select
              value={zoomLevel}
              onChange={(e) => setZoomLevel(e.target.value)}
              className="bg-[#1b1f2d] text-slate-200 font-medium px-2 py-1 rounded border border-[#2b3147] text-xs outline-none cursor-pointer"
            >
              <option value="fit">Fit Viewport</option>
              <option value="50%">50% Scale</option>
              <option value="75%">75% Scale</option>
              <option value="100%">100% 1:1 Pixel</option>
              <option value="150%">150% Detail</option>
            </select>
          </div>
        </div>

        {/* Safe Zones & Quality */}
        <div className="flex items-center space-x-3">
          <button
            onClick={() => setShowSafeZones(!showSafeZones)}
            className={`flex items-center space-x-1 px-2.5 py-1 rounded text-xs font-medium border transition ${
              showSafeZones 
                ? 'bg-cyan-950/80 border-cyan-500 text-cyan-400' 
                : 'bg-[#181b24] border-[#292f44] text-slate-400 hover:text-slate-200'
            }`}
            title="Toggle Action & Title Safe Zones"
          >
            <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
              <rect width="18" height="18" x="3" y="3" rx="2"></rect>
              <path d="M3 9h18"></path>
              <path d="M9 21V9"></path>
            </svg>
            <span>Safe Zones</span>
          </button>

          <span className="text-[11px] font-mono text-slate-400 bg-[#171a23] px-2 py-0.5 rounded border border-[#232838]">
            {res.w} × {res.h} • {project.fps} FPS
          </span>
        </div>
      </div>

      {/* Main Canvas Viewport Area */}
      <div className="flex-1 flex items-center justify-center p-4 overflow-hidden relative">
        <div
          className={`relative bg-black rounded-lg shadow-2xl border border-[#232838] overflow-hidden flex items-center justify-center transition-all ${getAspectClass()}`}
          style={{
            transform: zoomLevel === 'fit' ? 'scale(1)' : `scale(${parseFloat(zoomLevel) / 100})`,
            boxShadow: '0 20px 50px rgba(0, 0, 0, 0.85)'
          }}
        >
          <canvas
            ref={canvasRef}
            width={res.w}
            height={res.h}
            className="w-full h-full object-contain block"
          />
        </div>
      </div>

      {/* Transport Controls Bottom Bar */}
      <div className="h-14 bg-[#12141a] border-t border-[#202433] px-6 flex items-center justify-between z-10">
        {/* Left: Timecode Readout */}
        <div className="flex items-center space-x-2">
          <div className="bg-[#171a23] border border-[#232838] px-3 py-1.5 rounded-lg flex items-center space-x-2">
            <span className="text-cyan-400 font-mono-time text-sm font-bold tracking-wider">
              {formatTimecode(currentTime, project.fps)}
            </span>
            <span className="text-slate-500 font-mono text-xs">/</span>
            <span className="text-slate-400 font-mono-time text-xs font-semibold">
              {formatTimecode(project.duration, project.fps)}
            </span>
          </div>

          <div className="text-[11px] font-mono text-slate-500 pl-1">
            Frame: {Math.floor(currentTime * (project.fps || 30))}
          </div>
        </div>

        {/* Center: Play, Pause, Frame Stepping */}
        <div className="flex items-center space-x-2">
          {/* Jump to start */}
          <button
            onClick={() => setCurrentTime(0)}
            className="p-2 text-slate-400 hover:text-white rounded-lg hover:bg-[#1c202d] transition"
            title="Jump to Start (Home)"
          >
            <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
              <polygon points="19 20 9 12 19 4 19 20"></polygon>
              <line x1="5" y1="19" x2="5" y2="5"></line>
            </svg>
          </button>

          {/* Previous Frame */}
          <button
            onClick={() => stepFrame(-1)}
            className="p-2 text-slate-400 hover:text-white rounded-lg hover:bg-[#1c202d] transition"
            title="Previous Frame (Left Arrow)"
          >
            <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>

          {/* PLAY / PAUSE */}
          <button
            onClick={() => setIsPlaying(!isPlaying)}
            className="w-10 h-10 rounded-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 flex items-center justify-center shadow-lg shadow-cyan-500/30 transition transform active:scale-95"
            title={isPlaying ? 'Pause (Space)' : 'Play (Space)'}
          >
            {isPlaying ? (
              <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24">
                <rect x="6" y="4" width="4" height="16"></rect>
                <rect x="14" y="4" width="4" height="16"></rect>
              </svg>
            ) : (
              <svg className="w-5 h-5 fill-current ml-0.5" viewBox="0 0 24 24">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
              </svg>
            )}
          </button>

          {/* Next Frame */}
          <button
            onClick={() => stepFrame(1)}
            className="p-2 text-slate-400 hover:text-white rounded-lg hover:bg-[#1c202d] transition"
            title="Next Frame (Right Arrow)"
          >
            <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>

          {/* Jump to end */}
          <button
            onClick={() => setCurrentTime(project.duration)}
            className="p-2 text-slate-400 hover:text-white rounded-lg hover:bg-[#1c202d] transition"
            title="Jump to End"
          >
            <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
              <polygon points="5 4 15 12 5 20 5 4"></polygon>
              <line x1="19" y1="5" x2="19" y2="19"></line>
            </svg>
          </button>

          {/* Loop toggle */}
          <button
            onClick={() => setIsLooping(!isLooping)}
            className={`p-2 rounded-lg transition ${
              isLooping ? 'text-cyan-400 bg-cyan-950/60' : 'text-slate-400 hover:text-white hover:bg-[#1c202d]'
            }`}
            title="Loop Playback"
          >
            <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
              <polyline points="17 1 21 5 17 9"></polyline>
              <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
              <polyline points="7 23 3 19 7 15"></polyline>
              <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
            </svg>
          </button>
        </div>

        {/* Right: Playback Speed, Volume, Stereo Meter */}
        <div className="flex items-center space-x-4">
          {/* Speed Selector */}
          <div className="flex items-center space-x-1">
            <span className="text-[11px] text-slate-400 font-medium">Speed:</span>
            <select
              value={playbackSpeed}
              onChange={(e) => setPlaybackSpeed(parseFloat(e.target.value))}
              className="bg-[#1b1f2d] text-slate-200 font-semibold px-2 py-1 rounded border border-[#2b3147] text-xs outline-none cursor-pointer"
            >
              <option value="0.25">0.25x</option>
              <option value="0.5">0.5x</option>
              <option value="0.75">0.75x</option>
              <option value="1">1.0x (Normal)</option>
              <option value="1.25">1.25x</option>
              <option value="1.5">1.5x</option>
              <option value="2">2.0x</option>
              <option value="4">4.0x</option>
            </select>
          </div>

          {/* Master Volume */}
          <div className="flex items-center space-x-2">
            <button
              onClick={() => {
                const nextMute = !isMuted;
                setIsMuted(nextMute);
                audioEngine.setMasterVolume(nextMute ? 0 : volume);
              }}
              className="text-slate-400 hover:text-white transition"
              title={isMuted ? 'Unmute' : 'Mute'}
            >
              {isMuted || volume === 0 ? (
                <svg className="w-4 h-4 text-rose-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                  <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path>
                  <path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path>
                </svg>
              ) : (
                <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                  <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                  <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                </svg>
              )}
            </button>

            <input
              type="range"
              min="0"
              max="1"
              step="0.05"
              value={isMuted ? 0 : volume}
              onChange={(e) => {
                const val = parseFloat(e.target.value);
                setVolume(val);
                setIsMuted(false);
                audioEngine.setMasterVolume(val);
              }}
              className="w-18"
              title="Master Volume"
            />
          </div>

          {/* Real-time 12-segment Stereo Peak dB Meter */}
          <div className="flex items-center space-x-1 bg-[#171a23] border border-[#232838] px-2 py-1 rounded" title={`Audio Peak: ${audioMeter.peak} dB`}>
            {/* Left channel */}
            <div className="flex flex-col space-y-0.5 w-1.5 h-7 justify-end">
              {[...Array(8)].map((_, i) => {
                const threshold = (8 - i) / 8;
                const isLit = audioMeter.left >= threshold;
                const color = i < 2 ? 'active-red' : i < 4 ? 'active-yellow' : 'active-green';
                return (
                  <div key={i} className={`meter-led ${isLit ? color : ''}`}></div>
                );
              })}
            </div>

            {/* Right channel */}
            <div className="flex flex-col space-y-0.5 w-1.5 h-7 justify-end">
              {[...Array(8)].map((_, i) => {
                const threshold = (8 - i) / 8;
                const isLit = audioMeter.right >= threshold;
                const color = i < 2 ? 'active-red' : i < 4 ? 'active-yellow' : 'active-green';
                return (
                  <div key={i} className={`meter-led ${isLit ? color : ''}`}></div>
                );
              })}
            </div>

            <span className="text-[9px] font-mono font-bold text-slate-400 pl-1">
              {audioMeter.peak > -60 ? `${audioMeter.peak}dB` : '-∞'}
            </span>
          </div>
        </div>
      </div>
    </div>
  );
}



// Context-Sensitive Inspector Panel
function InspectorPanel({
  selectedClip,
  project,
  setProject,
  currentTime
}) {
  const [subTab, setSubTab] = React.useState('transform');

  if (!selectedClip) {
    return (
      <div className="w-80 bg-[#12141a] border-l border-[#202433] flex flex-col h-full p-4 select-none overflow-y-auto">
        <div className="flex items-center space-x-2 pb-3 border-b border-[#202433]">
          <svg className="w-4 h-4 text-cyan-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
            <rect width="18" height="18" x="3" y="3" rx="2"></rect>
            <path d="M9 3v18"></path>
          </svg>
          <h2 className="text-sm font-bold text-white tracking-wide uppercase">Project Properties</h2>
        </div>

        <div className="space-y-4 pt-4">
          <div>
            <label className="text-[11px] font-medium text-slate-400 block mb-1">Project Name</label>
            <input
              type="text"
              value={project.name}
              onChange={(e) => setProject(p => ({ ...p, name: e.target.value }))}
              className="w-full bg-[#181b24] text-xs font-semibold text-white px-3 py-2 rounded-lg border border-[#2b3147] outline-none"
            />
          </div>

          <div className="grid grid-cols-2 gap-2.5">
            <div>
              <label className="text-[11px] font-medium text-slate-400 block mb-1">Canvas Resolution</label>
              <select
                value={project.resolution}
                onChange={(e) => setProject(p => ({ ...p, resolution: e.target.value }))}
                className="w-full bg-[#181b24] text-xs font-semibold text-cyan-400 px-2.5 py-2 rounded-lg border border-[#2b3147] outline-none"
              >
                <option value="720p">720p HD</option>
                <option value="1080p">1080p Full HD</option>
                <option value="4K">4K Ultra HD</option>
              </select>
            </div>

            <div>
              <label className="text-[11px] font-medium text-slate-400 block mb-1">Framerate (FPS)</label>
              <select
                value={project.fps}
                onChange={(e) => setProject(p => ({ ...p, fps: parseInt(e.target.value) }))}
                className="w-full bg-[#181b24] text-xs font-semibold text-white px-2.5 py-2 rounded-lg border border-[#2b3147] outline-none"
              >
                <option value="24">24 FPS (Film)</option>
                <option value="30">30 FPS (Standard)</option>
                <option value="60">60 FPS (Smooth)</option>
              </select>
            </div>
          </div>

          <div className="p-3 bg-[#181b24] border border-[#262b3d] rounded-xl space-y-2">
            <div className="flex justify-between text-xs">
              <span className="text-slate-400">Total Duration:</span>
              <span className="text-white font-mono font-bold">{project.duration}s</span>
            </div>
            <div className="flex justify-between text-xs">
              <span className="text-slate-400">Total Tracks:</span>
              <span className="text-white font-mono font-bold">{project.tracks.length}</span>
            </div>
            <div className="flex justify-between text-xs">
              <span className="text-slate-400">Markers:</span>
              <span className="text-white font-mono font-bold">{project.markers.length}</span>
            </div>
          </div>

          <div className="p-4 bg-gradient-to-br from-[#181b24] to-[#12141a] border border-[#232838] rounded-xl text-center space-y-2">
            <svg className="w-8 h-8 text-slate-500 mx-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5">
              <rect width="18" height="18" x="3" y="3" rx="2"></rect>
              <circle cx="9" cy="9" r="2"></circle>
              <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path>
            </svg>
            <p className="text-xs font-semibold text-slate-300">No Clip Selected</p>
            <p className="text-[11px] text-slate-500">Click on any video, audio, text or subtitle clip on the timeline to edit its properties.</p>
          </div>
        </div>
      </div>
    );
  }

  // Update clip helper
  const updateClip = (updates) => {
    setProject(prev => {
      const newTracks = prev.tracks.map(t => {
        if (t.id !== selectedClip.trackId) return t;
        return {
          ...t,
          clips: t.clips.map(c => c.id === selectedClip.id ? { ...c, ...updates } : c)
        };
      });
      return { ...prev, tracks: newTracks };
    });
  };

  return (
    <div className="w-80 bg-[#12141a] border-l border-[#202433] flex flex-col h-full select-none overflow-hidden">
      {/* Header with Clip Name & Type */}
      <div className="h-12 border-b border-[#202433] px-4 flex items-center justify-between">
        <div className="flex items-center space-x-2 min-w-0">
          <span className="w-2.5 h-2.5 rounded-full bg-cyan-400"></span>
          <span className="text-xs font-bold text-white truncate max-w-[160px]">
            {selectedClip.name}
          </span>
        </div>
        <span className="text-[10px] uppercase font-bold px-2 py-0.5 rounded bg-[#202535] text-cyan-400 border border-cyan-800/40">
          {selectedClip.type}
        </span>
      </div>

      {/* Sub Tabs for Video Clip */}
      {selectedClip.type === 'video' && (
        <div className="flex border-b border-[#202433] bg-[#0f1117] overflow-x-auto text-xs">
          {[
            { id: 'transform', label: 'Transform' },
            { id: 'speed', label: 'Speed' },
            { id: 'color', label: 'Color' },
            { id: 'chroma', label: 'GreenScreen' },
            { id: 'keyframes', label: 'Keyframes' }
          ].map(tab => (
            <button
              key={tab.id}
              onClick={() => setSubTab(tab.id)}
              className={`px-3 py-2.5 font-semibold whitespace-nowrap transition border-b-2 ${
                subTab === tab.id
                  ? 'border-cyan-400 text-cyan-400 bg-[#171a23]'
                  : 'border-transparent text-slate-400 hover:text-slate-200'
              }`}
            >
              {tab.label}
            </button>
          ))}
        </div>
      )}

      {/* Sub Tab Content */}
      <div className="flex-1 p-4 overflow-y-auto space-y-4">
        {/* TRANSFORM TAB (Video & Images) */}
        {selectedClip.type === 'video' && subTab === 'transform' && (
          <div className="space-y-4">
            {/* Position X, Y */}
            <div>
              <div className="flex justify-between text-xs font-medium text-slate-300 mb-1">
                <span>Position (X, Y)</span>
                <span className="font-mono text-cyan-400">{Math.round(selectedClip.x || 0)}, {Math.round(selectedClip.y || 0)}</span>
              </div>
              <div className="grid grid-cols-2 gap-2">
                <input
                  type="number"
                  value={Math.round(selectedClip.x || 0)}
                  onChange={(e) => updateClip({ x: parseInt(e.target.value) || 0 })}
                  className="bg-[#181b24] text-xs font-mono text-white px-2.5 py-1.5 rounded border border-[#2b3147] outline-none"
                  placeholder="X"
                />
                <input
                  type="number"
                  value={Math.round(selectedClip.y || 0)}
                  onChange={(e) => updateClip({ y: parseInt(e.target.value) || 0 })}
                  className="bg-[#181b24] text-xs font-mono text-white px-2.5 py-1.5 rounded border border-[#2b3147] outline-none"
                  placeholder="Y"
                />
              </div>
            </div>

            {/* Scale */}
            <div>
              <div className="flex justify-between text-xs font-medium text-slate-300 mb-1">
                <span>Scale</span>
                <span className="font-mono text-cyan-400">{Math.round((selectedClip.scale || 1) * 100)}%</span>
              </div>
              <input
                type="range"
                min="0.1"
                max="3"
                step="0.05"
                value={selectedClip.scale || 1}
                onChange={(e) => updateClip({ scale: parseFloat(e.target.value) })}
                className="w-full"
              />
            </div>

            {/* Rotation */}
            <div>
              <div className="flex justify-between text-xs font-medium text-slate-300 mb-1">
                <span>Rotation</span>
                <span className="font-mono text-cyan-400">{Math.round(selectedClip.rotation || 0)}°</span>
              </div>
              <input
                type="range"
                min="-180"
                max="180"
                step="1"
                value={selectedClip.rotation || 0}
                onChange={(e) => updateClip({ rotation: parseInt(e.target.value) })}

                  type="number"
